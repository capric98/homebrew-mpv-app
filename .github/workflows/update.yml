name: Update mpv app

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-mpv-app
  cancel-in-progress: false

jobs:
  update:
    # Manual runs also update only the default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Run updater tests
        run: python3 -m unittest discover -s tests -v
      - name: Check stable release and verify changed builds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update.py
      - name: Check generated Cask syntax
        run: ruby -c Casks/mpv-app.rb
      - name: Commit and push verified update
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- Casks/mpv-app.rb; then
            echo "No update needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version=$(sed -n 's/^  version "\([0-9.]*\)"$/\1/p' Casks/mpv-app.rb)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Casks/mpv-app.rb
          git commit -m "Update mpv app to $version"
          git push origin "HEAD:$DEFAULT_BRANCH"
          echo "Updated mpv app to $version. Both download checksums and App layouts verified." >> "$GITHUB_STEP_SUMMARY"
